name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 静态检查（pyflakes）
        # 只在单个矩阵格子里跑，避免 9 个 job 重复同一件事。
        # 显式列出文件而不是用 shell 通配符：Windows 上的 pwsh 不会展开 *.py。
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes license_audit.py semantic_audit.py scan_projects.py \
            rescan_failed.py verify_sample.py recompute_scan.py \
            check_docs_consistency.py test_cases.py test_semantic.py \
            web/server.py web/__init__.py
      - name: 一致性闸门（文档声明的数字必须与代码/数据一致）
        # 防的是"文档落后于代码"这一类问题：它已连续两轮被第三方检查指出
        # （H1 交付数据滞后、L1 版本号不一致、L2/P2-1 文档用例数过时）。
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python check_docs_consistency.py
      - name: 运行回归测试
        run: |
          python test_cases.py
          python test_semantic.py
      - name: 端到端冒烟测试（需要网络）
        run: python license_audit.py --requirements fixture_project/requirements.txt --project-license MIT --out smoke_report.md
