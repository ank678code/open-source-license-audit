name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 运行回归测试
        run: |
          python test_cases.py
          python test_semantic.py
      - name: 端到端冒烟测试（需要网络）
        run: python license_audit.py --requirements fixture_project/requirements.txt --project-license MIT --out smoke_report.md
